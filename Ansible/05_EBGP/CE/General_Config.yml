---
- name: CONFIG IBGP AND VPN 
  hosts: R1,R2,R3,R7,R9
  gather_facts: false

  tasks:
    - name: Configure BGP for PE
      cisco.ios.ios_config:
        lines:
          - address-family ipv4 vrf  {{ item.vrf_name }}
          - neighbor {{ item.neighbor }} activate
        parents:
          - router bgp {{ asn }}
      loop: "{{ peers }}"
