---
- name: CONFIG IBGP AND VPN 
  hosts: R10,R11,R12,R13,R14
  gather_facts: false

  tasks:
    - name: Configure BGP for PE
      cisco.ios.ios_config:
        lines:
          - neighbor {{ item.neighbor }} remote-as {{ item.remote_as }}
          - network {{ item.neighbor }} mask 255.255.255.252
          - neighbor {{ item.neighbor }} activate
        parents:
          - router bgp {{ asn }}
      loop: "{{ peers }}"
